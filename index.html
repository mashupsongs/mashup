  <!-- Our own iframe rather than one the YouTube API builds for us, so we own
       the permissions. Note the explicit 'none': picture-in-picture defaults

       switch. It has to be denied by name. -->
  <div class="yt-host" aria-hidden="true">
    <iframe
      id="yt-player"
      title="Audio player"
      allow="autoplay; encrypted-media; picture-in-picture 'none'"
